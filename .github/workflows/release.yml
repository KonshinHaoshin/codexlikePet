name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Windows
            platform: windows-latest
            args: ''
          - name: Linux
            platform: ubuntu-22.04
            args: ''

    env:
      COPYFILE_DISABLE: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc signing lets downloaded macOS builds launch without an
          # Apple Developer certificate. Replace with certificate secrets when
          # production signing and notarization are configured.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: __VERSION__
          releaseName: SakiPet v__VERSION__
          releaseBody: |
            ## SakiPet

            一个可爱的跨平台桌面宠物，支持多种宠物资源、独立设置、互动台词、拖拽移动、
            宠物间对话、关系记忆和全屏覆盖显示。

            本版本构建 macOS Apple Silicon/Intel、Windows 和 Linux 安装包。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 2
          releaseAssetNamePattern: SakiPet-[platform]-[arch]-[bundle][ext]
          args: ${{ matrix.args }}
